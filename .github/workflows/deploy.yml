# Publishes the site/ folder to GitHub Pages on every push to main. There is no build step.
# One-time setup: in the repo, go to Settings > Pages and set "Source" to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish, but skip any queued between it and the newest push.
concurrency:
  group: pages
  cancel-in-progress: false

# Upload and deploy must be separate jobs: deploy-pages can't see an artifact uploaded earlier in its own job.
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
